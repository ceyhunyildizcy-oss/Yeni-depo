name: MCP config check

on:
  pull_request:
    paths:
      - '.mcp.json'
      - '.vscode/mcp.json'
      - 'MCP-STARTER-KIT/**'
      - '.github/workflows/mcp-config-check.yml'
  push:
    paths:
      - '.mcp.json'
      - '.vscode/mcp.json'
      - 'MCP-STARTER-KIT/**'
      - '.github/workflows/mcp-config-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python -m json.tool .mcp.json >/dev/null
          python -m json.tool .vscode/mcp.json >/dev/null

      - name: Validate shell syntax
        run: bash -n MCP-STARTER-KIT/check-prereqs.sh
