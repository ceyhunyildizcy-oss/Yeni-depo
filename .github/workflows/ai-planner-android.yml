name: Android AI Planner APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-ai-planner-mvp
    paths:
      - 'android-ai-planner/**'
      - '.github/workflows/ai-planner-android.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-ai-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK availability
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Planim-debug-apk
          path: android-ai-planner/app/build/outputs/apk/debug/app-debug.apk
