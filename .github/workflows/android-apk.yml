name: AI Asistan Android Debug APK
on:
  push:
    branches: [feature/ai-asistan-planlayici-v1]
    paths:
      - 'ai-asistan-planlayici/android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ai-asistan-planlayici/android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-asistan-v1-onayli-debug-apk
          path: ai-asistan-planlayici/android-app/app/build/outputs/apk/debug/app-debug.apk
